# crunch — multi-service stack for Coolify (docker-compose deployment).
#
#   app    : FrankenPHP/Octane + the PHP/ONNX core (web + in-process queue worker).
#   asr    : Whisper large-v3-turbo sidecar (faster-whisper). Internal only.
#   vision : Florence-2-base caption/detect sidecar (transformers). Internal only.
#   ocr    : OCR sidecar — Tesseract (default) + PaddleOCR (lazy). Internal only.
#
# Traefik routing for the public domain is declared explicitly on `app` below —
# Coolify's SERVICE_FQDN magic doesn't wire it for compose deploys, so we attach the
# external `coolify` proxy network and set the router/service labels ourselves.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - asr
      - vision
      - ocr
    environment:
      CRUNCH_ASR_URL: http://asr:9000
      CRUNCH_ASR_TIMEOUT: "600"
      CRUNCH_VISION_URL: http://vision:9000
      # Dedicated OCR sidecar (Tesseract default + PaddleOCR opt-in). Tesseract finishes in
      # well under a second; paddle on a dense crop can take 5–10s — 60s leaves margin under
      # Cloudflare's edge cutoff so a genuinely stuck call returns our 422, not a CF page.
      CRUNCH_OCR_URL: http://ocr:9000
      CRUNCH_OCR_TIMEOUT: "60"
      CRUNCH_OCR_DEFAULT_ENGINE: tesseract
      # Must clear Cloudflare's edge timeout with MARGIN: at 90s our 504 raced the edge and
      # the client got Cloudflare's opaque "error code: 504" page instead of our actionable
      # JSON. 30s lets our 504 ({"error":"…downscale or crop…"}) flush first. Healthy calls
      # finish far inside this (detect ~19s, caption ~11s, OCR crop ~7s); only dense
      # full-frame OCR exceeds it — which is exactly what should 504.
      CRUNCH_VISION_TIMEOUT: "30"
      # The SQLite file lives on the `database` volume at /data/db — NOT under /app/database.
      # Mounting a volume over /app/database shadows the image's database/migrations/, so
      # newly shipped migrations silently never run ("Nothing to migrate" on every boot —
      # bit us on the inference_jobs.progress column, 2026-07-02).
      DB_DATABASE: /data/db/database.sqlite
      # APP_KEY, CRUNCH_API_KEY, etc. are injected by Coolify's app env.
    volumes:
      - models:/data/models       # ONNX model cache (transformers-php)
      # Same named volume as before (data carries over) — only the mount point moved out of
      # /app so the image's database/migrations/ stays visible to `artisan migrate`.
      - database:/data/db          # SQLite (see DB_DATABASE above)
      - storage:/app/storage       # framework + app storage (incl. resolved audio temp)
    networks:
      - default                    # talk to `asr` by service name
      - coolify                    # reachable by the Traefik proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.crunch-http.entryPoints=http
      - traefik.http.routers.crunch-http.rule=Host(`crunch.stumason.dev`)
      - traefik.http.routers.crunch-http.middlewares=redirect-to-https
      - traefik.http.routers.crunch-http.service=crunch
      - traefik.http.routers.crunch-https.entryPoints=https
      - traefik.http.routers.crunch-https.rule=Host(`crunch.stumason.dev`)
      - traefik.http.routers.crunch-https.tls=true
      - traefik.http.routers.crunch-https.tls.certresolver=letsencrypt
      - traefik.http.routers.crunch-https.middlewares=gzip
      - traefik.http.routers.crunch-https.service=crunch
      - traefik.http.services.crunch.loadbalancer.server.port=8000

  asr:
    build:
      context: ./asr-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASR_MODEL: large-v3-turbo    # verbatim CrisperWhisper needs a GPU; turbo is the CPU answer
      ASR_COMPUTE_TYPE: int8
      # The Netcup x86 box is SHARED with ~18 other apps incl. revenue client sites. A
      # transcribe must NOT be able to peg every core, so cap threads here AND enforce a
      # hard CPU limit below — belt and braces. 6 of 12 vCPU leaves the web apps responsive.
      ASR_THREADS: "6"
      HF_HOME: /models
    deploy:
      resources:
        limits:
          cpus: "6"                # hard ceiling so a busy transcribe can't starve the box
    volumes:
      - asr_models:/models         # HF cache — persists the model download
    networks:
      - default                    # internal only; never exposed to Traefik

  vision:
    build:
      context: ./vision-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VISION_MODEL: microsoft/Florence-2-base
      HF_HOME: /models
      # Downscale frames whose longest edge exceeds this before inference (issue #11).
      # Keeps full-res screen captures inside the CPU latency budget; 0 disables.
      VISION_MAX_EDGE: "1024"
    volumes:
      - vision_models:/models      # HF cache — persists the model download
    networks:
      - default                    # internal only; never exposed to Traefik

  ocr:
    build:
      context: ./ocr-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Tesseract is the default (tiny, fast, layout-preserving). PaddleOCR is lazy-loaded
      # on the first engine=paddle request, so this service idles at ~70MB until then.
      OCR_DEFAULT_ENGINE: tesseract
      OCR_DEFAULT_PSM: "6"
      # The pack pipeline OCRs frames in parallel; this caps concurrent OCRs inside the
      # sidecar (excess requests queue). Each tesseract is pinned to one thread
      # (OMP_THREAD_LIMIT=1 in the Dockerfile), so parallelism ~= cores used.
      OCR_MAX_PARALLEL: "4"
    deploy:
      resources:
        limits:
          cpus: "4"                # same reasoning as asr: shared box, don't starve the web apps
    networks:
      - default                    # internal only; never exposed to Traefik

networks:
  coolify:
    external: true

volumes:
  models:
  database:
  storage:
  asr_models:
  vision_models:
